map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream toilet2_backend {
    zone toilet2_backend 64k;
    server toilet2:8000 resolve;
}

server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;
    server_name paslaugos.cms.lmio.lt;

    ssl_certificate /etc/letsencrypt/live/paslaugos.cms.lmio.lt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paslaugos.cms.lmio.lt/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://toilet2_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_redirect off;
    }
}
