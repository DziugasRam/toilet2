services:
  toilet2:
    build:
      context: .
    image: lmio-toilet2:latest
    restart: unless-stopped
    init: true
    env_file:
      - ${TOILET_ENV_FILE:-.env}
    environment:
      # The app port is available only on this private Compose network, whose
      # only other service is the nginx reverse proxy.
      FORWARDED_ALLOW_IPS: ${TOILET_FORWARDED_ALLOW_IPS:-*}
    expose:
      - "8000"
    volumes:
      # Mount the complete directory so SQLite's database, WAL, and SHM files
      # share the same durable filesystem.
      - toilet_data:/var/lib/lmio-toilet
    extra_hosts:
      # Keep the HTTPS hostname for certificate verification while routing
      # Control traffic over its private EC2 address.
      - "${TOILET_CONTROL_DNS_NAME:-ctrl.lmio.lt}=${TOILET_CONTROL_PRIVATE_IP:-172.31.47.173}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/operator/login', timeout=5).read(1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  nginx:
    image: jonasal/nginx-certbot:6.2.0-nginx1.31.3
    restart: always
    depends_on:
      toilet2:
        condition: service_healthy
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?set CERTBOT_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # user_conf.d preserves nginx-certbot's built-in ACME challenge and
      # HTTP-to-HTTPS configuration.
      - ./nginx/user_conf.d:/etc/nginx/user_conf.d:ro
      - nginx_secrets:/etc/letsencrypt
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  toilet_data:
    name: ${TOILET_DATA_VOLUME:-lmio-toilet-data}
  nginx_secrets:
    name: ${TOILET_NGINX_SECRETS_VOLUME:-lmio-toilet-nginx-secrets}
